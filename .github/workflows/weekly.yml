name: weekly

on:
  schedule:
    # Every Monday 00:30 UTC, per spec_v2 §5.
    - cron: "30 0 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Fetch data (Binance, incremental)
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p results
          python fetch_data.py 2>&1 | tee results/ci_fetch.log
          ls -la data/ >> results/ci_fetch.log

      - name: Run tests (hard gate)
        id: tests
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          python tests.py 2>&1 | tail -n 200 | tee results/ci_tests.log

      - name: Stop here if tests failed (results are only published from a verified engine)
        if: steps.tests.outcome == 'failure'
        run: |
          echo "tests.py failed — see results/ci_tests.log"; cat results/ci_tests.log | grep -v PASS | tail -n 60

      - name: Run weekly pipeline
        id: pipeline
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          python run_weekly.py 2>&1 | tee results/ci_run.log

      - name: Build weekly digest (harmless idempotent recomputation of what run_weekly.py already built)
        id: digest
        continue-on-error: true
        run: python digest.py

      - name: Commit & push updated data/results/docs
        id: commit
        continue-on-error: true
        run: |
          set -x
          exec > >(tee /tmp/commit.log) 2>&1
          git config user.name "deadoralive-bot"
          git config user.email "deadoralive-bot@users.noreply.github.com"
          git add -f data/ results/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "weekly: refresh data/results/site ($(date -u +%F))"
            git push
          fi

      - name: Publish to optional channels (buttondown/bluesky/mastodon/kaggle/huggingface)
        id: publish
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BUTTONDOWN_SEND_KO: ${{ secrets.BUTTONDOWN_SEND_KO }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python publish.py all

      - name: Fail the job if the pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "run_weekly.py failed — see results/ci_run.log (committed above)."
          exit 1

      - name: Report failure as an issue (logs are not downloadable from our dev box)
        if: always() && (steps.tests.outcome == 'failure' || steps.pipeline.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.fetch.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.run_id }}"
            echo; echo "## tests (results/ci_tests.log, non-PASS lines)"; echo '```'
            grep -v PASS results/ci_tests.log 2>/dev/null | tail -n 80 || echo "(no log)"
            echo '```'
            echo; echo "## fetch (results/ci_fetch.log)"; echo '```'
            tail -n 40 results/ci_fetch.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo; echo "## pipeline (results/ci_run.log, last 80 lines)"; echo '```'
            tail -n 80 results/ci_run.log 2>/dev/null || echo "(no log)"
            echo '```'; echo; echo "## commit step (/tmp/commit.log)"; echo '```'
            cat /tmp/commit.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > /tmp/issue.md
          gh issue create --title "weekly run failed ($(date -u +%F))" --body-file /tmp/issue.md || true
          exit 1
