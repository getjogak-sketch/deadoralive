name: research-attention

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "number of articles to sample (default 3000)"
        required: false
        default: "3000"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Self-test
        run: python research/attention/run_study.py --synthetic
      - name: Run study
        run: python research/attention/run_study.py --limit ${{ github.event.inputs.limit }} 2>&1 | tee research/attention/results/run.log || true
      - name: Commit results
        run: |
          git config user.name "deadoralive-bot"
          git config user.email "deadoralive-bot@users.noreply.github.com"
          git add -f research/attention/results/
          git commit -m "research: attention spike persistence study ($(date -u +%F))" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
