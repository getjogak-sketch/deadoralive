name: research-demand

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy pytrends
      - name: Self-test
        run: python research/demand/run_demand.py --synthetic
      - name: Run study
        run: python research/demand/run_demand.py 2>&1 | tee research/demand/results/run.log || true
      - name: Commit results
        run: |
          git config user.name "deadoralive-bot"
          git config user.email "deadoralive-bot@users.noreply.github.com"
          git add -f research/demand/results/
          git commit -m "research: search-demand study for candidate seas ($(date -u +%F))" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
